# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1

env:
  # Secret for signing email action tokens (ad approval links, etc.)
  # Create this secret with: firebase apphosting:secrets:set EMAIL_ACTION_TOKEN_SECRET
  - variable: EMAIL_ACTION_TOKEN_SECRET
    secret: EMAIL_ACTION_TOKEN_SECRET

  # NextAuth secret - also used as fallback for legacy email tokens
  # If you haven't created this secret yet, run: firebase apphosting:secrets:set NEXTAUTH_SECRET
  - variable: NEXTAUTH_SECRET
    secret: NEXTAUTH_SECRET
